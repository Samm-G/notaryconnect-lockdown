name = "notaryconnect-lockdown"
main = "./dist/worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"

[vars]
ENVIRONMENT = "production"
APP_NAME = "E-Stamp Sampark"
APP_DOMAIN = "convert.estampsampark.com"
JURISDICTION = "IN"
VITE_MAX_PAGE_COUNT = "15"
VITE_MAX_FILE_SIZE_MB = "50"
FILENAME_SUFFIX = "_NC"
VITE_FILENAME_SUFFIX = "_NC"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "kroldon-notary-audit"

# Cloudflare KV Binding for IP Rate Limiting & Auth Lockouts
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5b732bb2642c4920be2fdf405542008b"