name = "notaryconnect-lockdown"
main = "_worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets Directory (Replaces the legacy Pages build output directory)
[assets]
directory = "./dist"

[vars]
ENVIRONMENT = "production"
APP_NAME = "NotaryConnect Lockdown Utility"
APP_DOMAIN = "law.kroldon.app"
JURISDICTION = "IN"
VITE_MAX_PAGE_COUNT = "15"
VITE_MAX_FILE_SIZE_MB = "50"

# Production R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "kroldon-notary-audit"

# Cloudflare KV Binding for IP Rate Limiting & Auth Lockouts
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5b732bb2642c4920be2fdf405542008b"